name: rendel_push
description: >-
  Push notifications for Rendel follow-ups: straight to Apple on iOS (no
  Firebase), Firebase Cloud Messaging on Android without a version pin. Asks
  for permission, hands the token to Rendel, and opens Rendel's pushes.
version: 0.2.1
homepage: https://rendel.ai
# Added from git, beside `rendel` in the same public repository; pub.dev takes
# no package with a git dependency.
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  # The SDK as every snippet pins it, at the tag this package ships in: an app
  # pins `rendel` and `rendel_push` to the same tag, so every Flutter release
  # moves this `ref` too. `Rendel.setPushToken` and `handlePush` came in 0.59.0.
  rendel:
    git:
      url: https://github.com/neon-apps/rendel-flutter.git
      ref: v0.72.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0

# Native on both platforms (design/plans/push-channels.md): iOS asks Apple for
# the device token itself, and Android calls firebase-messaging from Gradle
# with a wide version range, so no Dart-side Firebase pin comes with it.
flutter:
  plugin:
    platforms:
      android:
        package: ai.rendel.push
        pluginClass: RendelPushPlugin
      ios:
        pluginClass: RendelPushPlugin
